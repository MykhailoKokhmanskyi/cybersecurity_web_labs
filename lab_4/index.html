<!DOCTYPE html>
<html>
	<head>
		<title>JS</title>
		<style>
			body, dialog {
				background-color: #fff;
				color: #000;
				transition: background-color 0.3s ease, color 0.3s ease;
			}

			body.dark-mode, dialog.dark-mode {
				background-color: #000;
				color: #fff;
			}
		</style>
	</head>
	<body>
		<button id="themeSwitch">Switch to dark mode</button>
		<div id="commentContainer">
			<p>Comments:</p>
		</div>
		<footer id="dynamicFooter"></footer>
		<dialog id="contactDialog">
			<form method="POST" id="contactForm" action="https://formspree.io/f/mjyyazby">
				<label for="nameInput">Name: </label>
				<input type="text" id="nameInput" name="name"/>
				<br/>
				<label for="emailInput">Email: </label>
				<input type="email" id="emailInput" name="email"/>
				<br/>
				<label for="phoneInput">Phone number: </label>
				<input type="tel" id="phoneInput" name="phoneNumber"/>
				<br/>
				<label for="paragraphInput">Message: </label>
				<textarea id="paragraphInput" rows="5" cols="40" name="messageBody"></textarea>
				<br/>
				<input type="submit" value="Contact me!"/>
			</form>
		</dialog>
		<script>
			const sysInfo = {
				userAgent: navigator.userAgent,
				platform: navigator.platform,
			}
			localStorage.setItem('sysInfo', JSON.stringify(sysInfo))
			
			const footer = document.getElementById('dynamicFooter')
			const commentContainer = document.getElementById("commentContainer")
			const dialog = document.getElementById('contactDialog')
			setTimeout(() => {
				dialog.showModal();
			}, 60000);
			footer.textContent = sysInfo.userAgent + "; " + sysInfo.platform
		
			try {
				fetch('https://jsonplaceholder.typicode.com/posts/11/comments')
					.then(response => {
						if(!response.ok) {
							throw new Error(`HTTP error! Status: ${response.status}`)
						}

						return response.json();
					})
					.then(data => {
						console.log(data)
						data.forEach((comment, index) => {
							const commentCard = document.createElement('div')
							commentCard.innerHTML = `
								<h3>${comment.name}</h3>
								<h4>${comment.email}</h4>
								<p>${comment.body}</p>
							`
							commentContainer.appendChild(commentCard)
						})
					})
			} catch (error) {
				console.error('Failed to fetch comments:', error)
			}

			let form = document.getElementById('contactForm')
			async function handleSubmit(event) {
				console.log("fired")
				event.preventDefault();
				let data = new FormData(event.target);

				fetch(event.target.action, {
					method: form.method,
					body: data,
					headers: {
						'Accept': 'application/json'
					}
				}).then(response => {
					if(response.ok) {
						form.reset();
						dialog.close()
					}
				}).catch(error => {
					console.error(error)
				})
			}
			form.addEventListener('submit', handleSubmit);

			const currentHour = new Date().getHours();
			const themeSwitch = document.getElementById('themeSwitch')
			let isWhiteTheme = currentHour >= 7 && currentHour <= 21;

			if(!isWhiteTheme) {
				document.body.classList.add('dark-mode');
				contactDialog.classList.add('dark-mode');
				themeSwitch.textContent = 'Switch to light mode'
			}

			themeSwitch.addEventListener('click', () => {
				document.body.classList.toggle('dark-mode')
				contactDialog.classList.toggle('dark-mode');

				if(document.body.classList.contains('dark-mode')) {
					themeSwitch.textContent = "Switch to light mode"
				} else {
					themeSwitch.textContent = "Switch to dark mode"
				}
			})
		</script>
	</body>
</html>
